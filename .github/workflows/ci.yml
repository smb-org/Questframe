name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Das Projekt "chromium-mobile" nutzt devices["iPhone 13"], und dessen
      # defaultBrowserType ist webkit — der Name sagt etwas anderes, als der
      # Lauf tut. Ohne webkit scheitern alle mobilen Specs am fehlenden Binary.
      - run: pnpm exec playwright install --with-deps chromium webkit
      # Die E2E-Tests brauchen einen lokalen Dev-Server, und der liest .dev.vars.
      # Die Datei ist ignoriert und existiert auf dem Runner nicht; ohne sie
      # antwortet /auth/dev mit 422 und jeder Test scheitert am fehlenden Login.
      # Erzeugt wird sie aus der Vorlage: nur die vier Platzhalter werden ersetzt,
      # TWITCH_CLIENT_ID, BROADCASTER_ID und PUBLIC_ORIGIN sind dort schon gueltig.
      # Die Werte sind Wegwerfwerte fuer APP_ENV=local; /auth/dev ist synthetisch
      # und ruft Twitch nie auf.
      - name: Lokale Testkonfiguration erzeugen
        run: |
          key() { openssl rand -base64 32 | tr '+/' '-_' | tr -d '='; }
          sed -e "s|^TWITCH_CLIENT_SECRET=.*|TWITCH_CLIENT_SECRET=local-twitch-client-secret|" \
              -e "s|^SESSION_ENCRYPTION_KEYS=.*|SESSION_ENCRYPTION_KEYS={\"active\":{\"id\":\"ci-v1\",\"key\":\"$(key)\"}}|" \
              -e "s|^SESSION_COOKIE_KEYS=.*|SESSION_COOKIE_KEYS={\"active\":{\"id\":\"ci-v1\",\"key\":\"$(key)\"}}|" \
              -e "s|^OVERLAY_TOKEN_PEPPER=.*|OVERLAY_TOKEN_PEPPER=$(key)|" \
              .dev.vars.example > .dev.vars
      - run: pnpm run check
      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
