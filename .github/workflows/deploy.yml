name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Isolierte Cloudflare-Umgebung
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: irl-stream-hud-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Build selected Cloudflare environment
        run: npm run "build:${{ inputs.target }}"
      - name: Deploy exact tested commit
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
